name: Build and Deploy to GH Pages
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        # Sets base-href to /AI-bot/ so assets load correctly on GitHub Pages
        run: npx ng build --configuration production --base-href "/AI-bot/"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Angular 17+ outputs to dist/<project-name>/browser
          # If your project name in angular.json is different, update 'AI-bot' below
          folder: dist/AI-bot/browser 
          branch: gh-pages
