name: Build and Deploy to GH Pages
on:
  push:
    branches:
    - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      # Use quotes for the directory name with a space
      run: npm install
      working-directory: "./AI bot"

    - name: Build
      # Ensure --base-href matches your repo name: /AI-bot/
      run: npx ng build --configuration production --base-href "/AI-bot/"
      working-directory: "./AI bot"

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        # Combined path: Subfolder + dist folder
        folder: "AI bot/dist/ai-chatbot"
        branch: gh-pages
