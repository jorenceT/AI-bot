<div class="messages-container">
  <div
    *ngFor="let msg of messages"
    class="message"
    [class.user-message]="msg.sender === 'user'"
    [class.system-message]="isSystemMessage(msg)"
  >
    <div class="message-content">
      <ng-container *ngIf="isSessionMarker(msg); else standardMessage">
        <div class="session-marker">
          <span class="session-marker-line" aria-hidden="true"></span>
          <span class="session-marker-label">{{ formatSessionMarker(msg.timestamp) }}</span>
          <span class="session-marker-line" aria-hidden="true"></span>
        </div>
      </ng-container>
      <ng-template #standardMessage>
        <strong>{{ msg.sender === 'user' ? 'You' : getCharacterName(msg.characterId) }}:</strong>
        <p>{{ msg.text }}</p>
        <small class="timestamp">{{ msg.timestamp | date:'short' }}</small>
      </ng-template>
      <button *ngIf="currentSpeakingMessageId !== msg.id && msg.sender === 'ai'" (click)="onSpeakMessage(msg)" class="btn-speak" title="Read aloud" aria-label="Read aloud">
        <svg class="message-audio-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z"></path>
          <path d="M16 8a6 6 0 0 1 0 8"></path>
          <path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"></path>
        </svg>
      </button>
      <button *ngIf="currentSpeakingMessageId === msg.id" (click)="onStopSpeaking()" class="btn-stop" title="Stop speaking" aria-label="Stop speaking">
        <span class="stop-square" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <div *ngIf="isLoading && !isGreetingLoading" class="loading-indicator">
    <p>AI is thinking...</p>
  </div>
  <div *ngIf="lastFailedMessage && !isLoading" class="retry-container">
    <button (click)="onRetryMessage()" class="btn-retry" title="Retry getting AI response">
      <svg class="retry-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      <span>Retry</span>
    </button>
  </div>
</div>

<div class="input-area">
  <div class="input-group">
    <input
      [(ngModel)]="userInput"
      (keyup.enter)="onSendMessage()"
      placeholder="Type your message..."
      class="message-input"
      [disabled]="isLoading || isGreetingLoading"
    >
    <div class="input-buttons">
      <button
        (click)="onSendMessage()"
        [disabled]="isLoading || isGreetingLoading || !userInput.trim()"
        class="btn-send"
        title="Send"
      >
        <span>{{ isLoading ? '...' : 'Send' }}</span>
      </button>
      <button (click)="onClearChat()" class="btn-clear" title="Clear Chat">
        <span>Clear</span>
      </button>
    </div>
  </div>
</div>
